name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # La Fase 1 sólo usa la librería estándar; las pruebas sólo requieren pytest.
      # Cuando avancen las fases, instalar requirements.txt completo aquí.
      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest
